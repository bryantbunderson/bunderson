<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bunderson</title>
<style>
    body {
        margin:0;
        font-family: "Georgia", "Times New Roman", serif;
        color:#4a3424;
        background-color:#efe2c4;
        background-image:
            radial-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
            radial-gradient(rgba(0,0,0,0.03) 1px, transparent 1px);
        background-size:4px 4px, 6px 6px;
        background-position:0 0, 2px 2px;
    }

    .page {
        max-width:1100px;
        margin:auto;
        padding:40px 30px 60px 30px;
    }

    h1 {
        text-align:center;
        font-size:64px;
        letter-spacing:4px;
        margin-bottom:10px;
        color:#5b3b22;
        text-shadow:1px 1px 0 #fff5d6;
    }

    .subtitle {
        text-align:center;
        font-size:18px;
        margin-bottom:40px;
        font-style:italic;
        color:#7a5a3a;
    }

    .frame {
        background:#f6ecd2;
        padding:25px;
        border:6px solid #7a5a3a;
        border-radius:6px;
        box-shadow:
            0 8px 18px rgba(0,0,0,0.25),
            inset 0 0 40px rgba(0,0,0,0.08);
    }

    img {
        width:100%;
        height:auto;
        display:block;
        border:3px solid #8b6a47;
        background:white;
    }

    footer {
        text-align:center;
        margin-top:40px;
        font-size:14px;
        color:#6b4c2f;
        opacity:0.8;
    }
</style>
</head>
<body>

<div class="page">

<h1>Bunderson</h1>
<div class="subtitle"></div>

<div class="frame">
<img src="bunderson-family-tree.png" alt="Bunderson Family"></div>

<footer>
</footer>

</div>

</body>
</html>
